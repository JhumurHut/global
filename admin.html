<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhumur Hut - Admin Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { 800: '#981334', 900: '#801430' } } } } }
    </script>
</head>
<body class="min-h-screen bg-[#FFFDF9] text-slate-800 flex flex-col justify-center items-center p-4">

    <!-- LOGIN SECTION -->
    <div id="loginSection" class="w-full max-w-md bg-white p-8 rounded-3xl shadow-2xl border">
        <div class="text-center mb-8">
            <h1 class="font-serif text-3xl font-bold text-brand-900">Jhumur Hut</h1>
            <p class="text-slate-500 text-xs mt-1">Admin Portal Login</p>
        </div>
        <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block font-bold mb-1">Email</label>
                <input type="email" id="adminEmail" required class="w-full p-3 border rounded-xl" placeholder="admin@jhumurhut.com">
            </div>
            <div>
                <label class="block font-bold mb-1">Password</label>
                <input type="password" id="adminPass" required class="w-full p-3 border rounded-xl" placeholder="••••••••">
            </div>
            <p id="errorMsg" class="text-rose-600 hidden font-bold text-center">Incorrect login credentials!</p>
            <button type="submit" class="w-full bg-brand-900 text-white font-bold py-3.5 rounded-xl">Log In</button>
        </form>
        <p class="text-[11px] text-center text-slate-400 mt-4">Pass: <b>jhumur2026</b></p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardSection" class="w-full max-w-4xl bg-white p-8 rounded-3xl shadow-2xl border hidden my-6">
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <h2 class="font-serif text-2xl font-bold text-brand-900">Admin Control Center</h2>
            <div class="flex gap-2">
                <a href="orders.html" class="bg-amber-600 text-white px-4 py-2 rounded-xl text-xs font-bold">Manage Orders</a>
                <button onclick="logout()" class="bg-slate-200 px-4 py-2 rounded-xl text-xs font-bold">Log Out</button>
            </div>
        </div>

        <div class="space-y-6 text-xs">
            <div class="bg-brand-50 p-4 rounded-2xl border space-y-3">
                <h3 class="font-bold text-sm text-slate-800">Add Product & Stock Quantity</h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="text" id="pName" placeholder="Product Name" class="p-3 border rounded-xl bg-white">
                    <input type="number" id="pPrice" placeholder="Price (৳)" class="p-3 border rounded-xl bg-white">
                    <input type="number" id="pStock" placeholder="Stock Quantity" class="p-3 border rounded-xl bg-white">
                    <select id="pCategory" class="p-3 border rounded-xl bg-white">
                        <option value="Skincare">Skincare</option>
                        <option value="Makeup">Makeup</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Jewelry">Jewelry</option>
                    </select>
                    <input type="text" id="pImg" placeholder="Image URL" class="p-3 border rounded-xl bg-white sm:col-span-2">
                </div>
                <button onclick="saveProduct()" class="bg-brand-900 text-white px-6 py-2.5 rounded-xl font-bold">Save Product</button>
            </div>

            <div>
                <h3 class="font-bold text-sm mb-3">Inventory Stock List</h3>
                <div id="productList" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            if(document.getElementById('adminEmail').value === "admin@jhumurhut.com" && document.getElementById('adminPass').value === "jhumur2026") {
                sessionStorage.setItem('logged', 'true');
                showDashboard();
            } else { document.getElementById('errorMsg').classList.remove('hidden'); }
        }

        function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            renderList();
        }

        function logout() { sessionStorage.removeItem('logged'); location.reload(); }

        function getProducts() {
            const saved = localStorage.getItem('jhumur_products');
            return saved ? JSON.parse(saved) : [
                { id: 1, name: "Rose Silk Hydrating Serum", category: "Skincare", price: 1250, stock: 15, image: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&w=600&q=80" },
                { id: 2, name: "Royal Velvet Matte Lipstick", category: "Makeup", price: 850, stock: 8, image: "https://images.unsplash.com/photo-1586495777744-4413f21062fa?auto=format&fit=crop&w=600&q=80" }
            ];
        }

        function saveProduct() {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const stock = document.getElementById('pStock').value;
            const category = document.getElementById('pCategory').value;
            const image = document.getElementById('pImg').value;

            if(!name || !price) return alert('Name and Price required!');

            let products = getProducts();
            products.push({ id: Date.now(), name, price: parseFloat(price), stock: parseInt(stock || 10), category, image: image || 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e' });
            localStorage.setItem('jhumur_products', JSON.stringify(products));
            renderList();
            alert('Product & Stock saved!');
        }

        function deleteProd(id) {
            let products = getProducts().filter(p => p.id !== id);
            localStorage.setItem('jhumur_products', JSON.stringify(products));
            renderList();
        }

        function renderList() {
            document.getElementById('productList').innerHTML = getProducts().map(p => `
                <div class="flex justify-between items-center p-3 bg-slate-50 border rounded-xl">
                    <span><b>${p.name}</b> - ৳ ${p.price} | Stock: <span class="text-emerald-600 font-bold">${p.stock}</span></span>
                    <button onclick="deleteProd(${p.id})" class="text-rose-600 font-bold px-2 py-1">Delete</button>
                </div>
            `).join('');
        }

        if(sessionStorage.getItem('logged') === 'true') showDashboard();
    </script>
</body>
</html>
