<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account Dashboard - Jhumur Hut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pinkshade: {
                            50: '#FFF0F5', 100: '#FFE4E1', 200: '#FBCFE8', 300: '#F472B6',
                            500: '#EC4899', 700: '#BE185D', 800: '#9D174D', 900: '#831843', 950: '#500724'
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        cursive: ['Great Vibes', 'cursive']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-[#FFF0F5] via-[#F8E7F6] to-[#FAF0F8] text-slate-800 min-h-screen font-sans">

    <!-- HEADER -->
    <header class="bg-white/80 backdrop-blur-md border-b border-pinkshade-200 py-4 px-8 flex justify-between items-center sticky top-0 z-40 shadow-sm">
        <a href="index.html" class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-pinkshade-300 via-pinkshade-500 to-white p-0.5 overflow-hidden">
                <div class="w-full h-full bg-white rounded-full flex items-center justify-center overflow-hidden">
                    <img src="https://raw.githubusercontent.com/JhumurHut/global/refs/heads/main/Logo.png" class="w-full h-full object-cover">
                </div>
            </div>
            <span class="font-cursive text-3xl font-normal text-pinkshade-900">Jhumur Hut</span>
        </a>
        <div class="flex items-center gap-6 text-xs font-semibold text-slate-700">
            <a href="index.html" class="hover:text-pinkshade-800">Home</a>
            <button onclick="logout()" class="hover:text-rose-600 bg-pinkshade-100 text-pinkshade-900 px-4 py-2 rounded-full transition">Sign Out</button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-5xl mx-auto px-4 py-12 space-y-8">
        
        <!-- WELCOME HEADER -->
        <div class="text-center space-y-2">
            <h1 class="font-serif text-3xl font-bold text-pinkshade-950">Welcome Back, <span id="welcomeName" class="font-semibold">User</span> ✨</h1>
            <p class="text-xs text-slate-500">Manage your profile and track your orders seamlessly</p>
        </div>

        <!-- TAB NAVIGATION -->
        <div class="flex justify-center border-b border-pinkshade-200">
            <button onclick="switchTab('profile')" id="tabProfileBtn" class="px-6 py-3 text-xs font-bold border-b-2 border-pinkshade-800 text-pinkshade-900">Profile</button>
            <button onclick="switchTab('orders')" id="tabOrdersBtn" class="px-6 py-3 text-xs font-semibold border-b-2 border-transparent text-slate-500 hover:text-pinkshade-900">Order History</button>
        </div>

        <!-- TAB 1: PROFILE CONTENT -->
        <div id="tabProfile" class="space-y-6">
            <div class="bg-white/80 backdrop-blur-md p-8 rounded-3xl border border-pinkshade-200 space-y-6 max-w-2xl mx-auto shadow-lg">
                <div class="flex justify-between items-center border-b border-pinkshade-100 pb-4">
                    <h3 class="font-serif font-bold text-base text-pinkshade-950">Personal Details</h3>
                    <button onclick="openEditProfileModal()" class="bg-pinkshade-100 text-pinkshade-900 px-4 py-2 rounded-xl text-xs font-bold hover:bg-pinkshade-200 transition">Edit Profile</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                    <div>
                        <span class="text-slate-400 block mb-1">Full Name:</span>
                        <span id="uName" class="font-bold text-slate-800">-</span>
                    </div>
                    <div>
                        <span class="text-slate-400 block mb-1">Phone Number:</span>
                        <span id="uPhone" class="font-bold text-slate-800">-</span>
                    </div>
                    <div>
                        <span class="text-slate-400 block mb-1">Email Address:</span>
                        <span id="uEmail" class="font-bold text-slate-800">-</span>
                    </div>
                    <div>
                        <span class="text-slate-400 block mb-1">Delivery Address:</span>
                        <span id="uAddress" class="font-bold text-slate-800">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2: ORDER HISTORY CONTENT -->
        <div id="tabOrders" class="hidden space-y-6">
            <div class="bg-white/80 backdrop-blur-md rounded-3xl border border-pinkshade-200 overflow-hidden shadow-lg">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="bg-pinkshade-50/80 border-b border-pinkshade-200 text-pinkshade-900 uppercase tracking-wider">
                                <th class="p-4 font-bold">Order ID</th>
                                <th class="p-4 font-bold">Order Date</th>
                                <th class="p-4 font-bold">Amount</th>
                                <th class="p-4 font-bold">Status</th>
                                <th class="p-4 font-bold text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="orderTableBody" class="divide-y divide-pinkshade-100">
                            <!-- Injected dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- CUSTOM WEBSITE POPUP FOR ORDER CANCEL CONFIRMATION -->
    <div id="cancelConfirmModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl border border-pinkshade-200 space-y-4 relative">
            <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div class="space-y-1">
                <h3 class="font-serif text-lg font-bold text-slate-900">Cancel Order?</h3>
                <p class="text-xs text-slate-500">Are you sure you want to cancel order <span id="targetOrderId" class="font-bold text-slate-800"></span>?</p>
            </div>
            <div class="flex gap-3 pt-2">
                <button onclick="closeCancelModal()" class="flex-1 bg-slate-100 text-slate-700 font-bold py-2.5 rounded-xl hover:bg-slate-200 transition text-xs">No, Keep It</button>
                <button onclick="confirmOrderCancellation()" class="flex-1 bg-rose-600 text-white font-bold py-2.5 rounded-xl hover:bg-rose-700 transition text-xs shadow-md">Yes, Cancel</button>
            </div>
        </div>
    </div>

    <!-- EDIT PROFILE MODAL -->
    <div id="editProfileModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-md hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border border-pinkshade-200 space-y-4 text-xs relative">
            <button onclick="closeEditProfileModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-pinkshade-100 text-pinkshade-900 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            <div class="text-center">
                <h3 class="font-serif text-xl font-bold text-pinkshade-950">Edit Personal Details</h3>
            </div>
            <form onsubmit="saveEditedProfile(event)" class="space-y-3">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Full Name</label>
                    <input type="text" id="editName" required class="w-full p-3 border rounded-xl bg-pinkshade-50/50">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Phone Number</label>
                    <input type="tel" id="editPhone" required class="w-full p-3 border rounded-xl bg-pinkshade-50/50">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Delivery Address</label>
                    <textarea id="editAddress" required class="w-full p-3 border rounded-xl bg-pinkshade-50/50 h-16"></textarea>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-pinkshade-700 to-pinkshade-900 text-white font-bold py-3.5 rounded-xl shadow-lg hover:from-pinkshade-800 transition">Save Changes</button>
            </form>
        </div>
    </div>

    <script>
        let loggedUser = JSON.parse(localStorage.getItem('jhumur_logged_user'));
        let selectedCancelOrderId = null;

        if (!loggedUser) {
            alert('Please login first!');
            window.location.href = "login.html";
        } else {
            loadUserData();
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('tab') === 'orders') {
                switchTab('orders');
            }
        }

        function loadUserData() {
            document.getElementById('welcomeName').innerText = loggedUser.name;
            document.getElementById('uName').innerText = loggedUser.name;
            document.getElementById('uEmail').innerText = loggedUser.email;
            document.getElementById('uPhone').innerText = loggedUser.phone;
            document.getElementById('uAddress').innerText = loggedUser.address;
            renderOrdersTable();
        }

        function switchTab(tab) {
            if(tab === 'profile') {
                document.getElementById('tabProfile').classList.remove('hidden');
                document.getElementById('tabOrders').classList.add('hidden');
                document.getElementById('tabProfileBtn').className = "px-6 py-3 text-xs font-bold border-b-2 border-pinkshade-800 text-pinkshade-900";
                document.getElementById('tabOrdersBtn').className = "px-6 py-3 text-xs font-semibold border-b-2 border-transparent text-slate-500 hover:text-pinkshade-900";
            } else {
                document.getElementById('tabProfile').classList.add('hidden');
                document.getElementById('tabOrders').classList.remove('hidden');
                document.getElementById('tabOrdersBtn').className = "px-6 py-3 text-xs font-bold border-b-2 border-pinkshade-800 text-pinkshade-900";
                document.getElementById('tabProfileBtn').className = "px-6 py-3 text-xs font-semibold border-b-2 border-transparent text-slate-500 hover:text-pinkshade-900";
            }
        }

        function openEditProfileModal() {
            document.getElementById('editName').value = loggedUser.name || '';
            document.getElementById('editPhone').value = loggedUser.phone || '';
            document.getElementById('editAddress').value = loggedUser.address || '';
            document.getElementById('editProfileModal').classList.remove('hidden');
        }

        function closeEditProfileModal() {
            document.getElementById('editProfileModal').classList.add('hidden');
        }

        function saveEditedProfile(e) {
            e.preventDefault();
            loggedUser.name = document.getElementById('editName').value;
            loggedUser.phone = document.getElementById('editPhone').value;
            loggedUser.address = document.getElementById('editAddress').value;

            localStorage.setItem('jhumur_logged_user', JSON.stringify(loggedUser));
            alert('Profile updated!');
            closeEditProfileModal();
            loadUserData();
        }

        function renderOrdersTable() {
            const orders = JSON.parse(localStorage.getItem('jhumur_orders') || '[]');
            const tbody = document.getElementById('orderTableBody');

            if(orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400">No purchase records found.</td></tr>`;
                return;
            }

            tbody.innerHTML = orders.map(ord => {
                const status = ord.status || 'PROCESSING';
                let statusBadge = '<span class="text-amber-600 font-bold">PROCESSING</span>';
                if(status === 'DELIVERED') statusBadge = '<span class="text-emerald-600 font-bold">DELIVERED</span>';
                if(status === 'CANCELLED') statusBadge = '<span class="text-rose-600 font-bold">CANCELLED</span>';

                return `
                    <tr class="hover:bg-pinkshade-50/50 transition">
                        <td class="p-4 font-bold text-slate-900">${ord.orderId || ord.id}</td>
                        <td class="p-4 text-slate-500">${ord.dateTime || ord.date}</td>
                        <td class="p-4 font-bold text-pinkshade-800">৳ ${(ord.grandTotal || ord.total).toLocaleString()}</td>
                        <td class="p-4">${statusBadge}</td>
                        <td class="p-4 text-right space-x-2">
                            ${status === 'PROCESSING' ? `<button onclick="promptCancelModal('${ord.orderId || ord.id}')" class="text-rose-600 font-bold hover:underline">Cancel Order</button>` : ''}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function promptCancelModal(id) {
            selectedCancelOrderId = id;
            document.getElementById('targetOrderId').innerText = id;
            document.getElementById('cancelConfirmModal').classList.remove('hidden');
        }

        function closeCancelModal() {
            selectedCancelOrderId = null;
            document.getElementById('cancelConfirmModal').classList.add('hidden');
        }

        function confirmOrderCancellation() {
            if(!selectedCancelOrderId) return;
            let orders = JSON.parse(localStorage.getItem('jhumur_orders') || '[]');
            let orderIndex = orders.findIndex(o => (o.orderId || o.id) === selectedCancelOrderId);
            if(orderIndex !== -1) {
                orders[orderIndex].status = 'CANCELLED';
                localStorage.setItem('jhumur_orders', JSON.stringify(orders));
                renderOrdersTable();
            }
            closeCancelModal();
        }

        function logout() {
            localStorage.removeItem('jhumur_logged_user');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
