<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Jhumur Hut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { pinkshade: { 50: '#FFF0F5', 100: '#FFE4E1', 200: '#FBCFE8', 500: '#EC4899', 700: '#BE185D', 800: '#9D174D', 900: '#831843' } },
                    fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Plus Jakarta Sans', 'sans-serif'], cursive: ['Great Vibes', 'cursive'] }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F9F9F9] text-slate-800 min-h-screen font-sans">

    <!-- HEADER -->
    <header class="bg-white border-b py-4 px-8 flex justify-between items-center sticky top-0 z-40">
        <a href="index.html" class="font-cursive text-3xl text-pinkshade-900 font-bold">Jhumur Hut</a>
        <div class="flex items-center gap-6 text-xs font-semibold text-slate-700">
            <a href="index.html" class="hover:text-pinkshade-800">Home</a>
            <button onclick="logout()" class="hover:text-rose-600">Sign Out</button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-5xl mx-auto px-4 py-12 space-y-8">
        
        <!-- WELCOME HEADER -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-light text-slate-900">Welcome Back, <span id="welcomeName" class="font-semibold">User</span></h1>
            <button onclick="logout()" class="text-xs text-slate-500 underline hover:text-slate-800">Sign Out</button>
        </div>

        <!-- TAB NAVIGATION (TEMPLATE 1 & 3 MATCHED) -->
        <div class="flex justify-center border-b border-slate-200">
            <button onclick="switchTab('profile')" id="tabProfileBtn" class="px-6 py-3 text-xs font-bold border-b-2 border-black text-black">Profile</button>
            <button onclick="switchTab('orders')" id="tabOrdersBtn" class="px-6 py-3 text-xs font-semibold border-b-2 border-transparent text-slate-500 hover:text-black">Order History</button>
        </div>

        <!-- TAB 1: PROFILE CONTENT -->
        <div id="tabProfile" class="space-y-6">
            <div class="bg-white p-8 rounded-2xl border border-slate-200 space-y-6 max-w-2xl mx-auto shadow-sm">
                <div class="flex justify-between items-center border-b pb-4">
                    <h3 class="font-bold text-sm text-slate-900">Personal Details</h3>
                    <button onclick="openEditProfileModal()" class="text-xs text-pinkshade-800 font-bold hover:underline">Edit Profile</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                    <div>
                        <span class="text-slate-400 block mb-1">Full Name:</span>
                        <span id="uName" class="font-semibold text-slate-800">-</span>
                    </div>
                    <div>
                        <span class="text-slate-400 block mb-1">Phone Number:</span>
                        <span id="uPhone" class="font-semibold text-slate-800">-</span>
                    </div>
                    <div>
                        <span class="text-slate-400 block mb-1">Email Address:</span>
                        <span id="uEmail" class="font-semibold text-slate-800">-</span>
                    </div>
                    <div>
                        <span class="text-slate-400 block mb-1">Delivery Address:</span>
                        <span id="uAddress" class="font-semibold text-slate-800">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2: ORDER HISTORY CONTENT (TEMPLATE 3 TABLE DESIGN) -->
        <div id="tabOrders" class="hidden space-y-6">
            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b text-slate-500 uppercase tracking-wider">
                                <th class="p-4 font-semibold">Order ID</th>
                                <th class="p-4 font-semibold">Order Date</th>
                                <th class="p-4 font-semibold">Amount</th>
                                <th class="p-4 font-semibold">Status</th>
                                <th class="p-4 font-semibold text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="orderTableBody" class="divide-y divide-slate-100">
                            <!-- Injected dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- EDIT PROFILE MODAL -->
    <div id="editProfileModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 text-xs relative">
            <button onclick="closeEditProfileModal()" class="absolute top-4 right-4 text-slate-400 hover:text-black"><i class="fa-solid fa-xmark text-base"></i></button>
            <h3 class="font-bold text-base text-slate-900 border-b pb-2">Edit Personal Details</h3>
            <form onsubmit="saveEditedProfile(event)" class="space-y-3">
                <div>
                    <label class="block font-semibold mb-1">Full Name</label>
                    <input type="text" id="editName" required class="w-full p-2.5 border rounded-lg">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Phone Number</label>
                    <input type="tel" id="editPhone" required class="w-full p-2.5 border rounded-lg">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Delivery Address</label>
                    <textarea id="editAddress" required class="w-full p-2.5 border rounded-lg h-16"></textarea>
                </div>
                <button type="submit" class="w-full bg-black text-white font-bold py-3 rounded-lg hover:bg-slate-800 transition">Save Changes</button>
            </form>
        </div>
    </div>

    <script>
        let loggedUser = JSON.parse(localStorage.getItem('jhumur_logged_user'));
        if (!loggedUser) {
            alert('Please login first!');
            window.location.href = "login.html";
        } else {
            loadUserData();
        }

        function loadUserData() {
            document.getElementById('welcomeName').innerText = loggedUser.name;
            document.getElementById('uName').innerText = loggedUser.name;
            document.getElementById('uEmail').innerText = loggedUser.email;
            document.getElementById('uPhone').innerText = loggedUser.phone;
            document.getElementById('uAddress').innerText = loggedUser.address;
            renderOrdersTable();
        }

        function switchTab(tab) {
            if(tab === 'profile') {
                document.getElementById('tabProfile').classList.remove('hidden');
                document.getElementById('tabOrders').classList.add('hidden');
                document.getElementById('tabProfileBtn').className = "px-6 py-3 text-xs font-bold border-b-2 border-black text-black";
                document.getElementById('tabOrdersBtn').className = "px-6 py-3 text-xs font-semibold border-b-2 border-transparent text-slate-500 hover:text-black";
            } else {
                document.getElementById('tabProfile').classList.add('hidden');
                document.getElementById('tabOrders').classList.remove('hidden');
                document.getElementById('tabOrdersBtn').className = "px-6 py-3 text-xs font-bold border-b-2 border-black text-black";
                document.getElementById('tabProfileBtn').className = "px-6 py-3 text-xs font-semibold border-b-2 border-transparent text-slate-500 hover:text-black";
            }
        }

        function openEditProfileModal() {
            document.getElementById('editName').value = loggedUser.name || '';
            document.getElementById('editPhone').value = loggedUser.phone || '';
            document.getElementById('editAddress').value = loggedUser.address || '';
            document.getElementById('editProfileModal').classList.remove('hidden');
        }

        function closeEditProfileModal() {
            document.getElementById('editProfileModal').classList.add('hidden');
        }

        function saveEditedProfile(e) {
            e.preventDefault();
            loggedUser.name = document.getElementById('editName').value;
            loggedUser.phone = document.getElementById('editPhone').value;
            loggedUser.address = document.getElementById('editAddress').value;

            localStorage.setItem('jhumur_logged_user', JSON.stringify(loggedUser));
            alert('Profile updated!');
            closeEditProfileModal();
            loadUserData();
        }

        function renderOrdersTable() {
            const orders = JSON.parse(localStorage.getItem('jhumur_orders') || '[]');
            const tbody = document.getElementById('orderTableBody');

            if(orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400">No purchase records found.</td></tr>`;
                return;
            }

            tbody.innerHTML = orders.map(ord => {
                const status = ord.status || 'PROCESSING';
                let statusBadge = '<span class="text-amber-600 font-bold">PROCESSING</span>';
                if(status === 'DELIVERED') statusBadge = '<span class="text-emerald-600 font-bold">DELIVERED</span>';
                if(status === 'CANCELLED') statusBadge = '<span class="text-rose-600 font-bold">CANCELLED</span>';

                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-4 font-bold text-slate-900">${ord.orderId || ord.id}</td>
                        <td class="p-4 text-slate-500">${ord.dateTime || ord.date}</td>
                        <td class="p-4 font-bold text-slate-800">BDT ${(ord.grandTotal || ord.total).toLocaleString()}</td>
                        <td class="p-4">${statusBadge}</td>
                        <td class="p-4 text-right space-x-2">
                            ${status === 'PROCESSING' ? `<button onclick="cancelOrder('${ord.orderId || ord.id}')" class="text-rose-600 font-bold hover:underline">Cancel Order</button>` : ''}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function cancelOrder(id) {
            if(confirm('Are you sure you want to cancel this order?')) {
                let orders = JSON.parse(localStorage.getItem('jhumur_orders') || '[]');
                let orderIndex = orders.findIndex(o => (o.orderId || o.id) === id);
                if(orderIndex !== -1) {
                    orders[orderIndex].status = 'CANCELLED';
                    localStorage.setItem('jhumur_orders', JSON.stringify(orders));
                    alert('Order cancelled successfully! The cancelled record remains in your history.');
                    renderOrdersTable();
                }
            }
        }

        function logout() {
            localStorage.removeItem('jhumur_logged_user');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
