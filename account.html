<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | Jhumur Hut</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/JhumurHut/global/refs/heads/main/Logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { pinkshade: { 50: '#FFF5F8', 100: '#FFE8EF', 300: '#FAA0B5', 700: '#B81155', 800: '#8E0D41', 950: '#42031B' } } } } }
    </script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #FFFFFF 0%, #FFF0F5 50%, #FFE4E1 100%); min-height: 100vh; }</style>
</head>
<body class="flex flex-col justify-between min-h-screen">
    <header class="bg-gradient-to-r from-pinkshade-950 to-pinkshade-800 text-white py-4 px-6 shadow">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <div class="h-12 w-auto"><img src="https://raw.githubusercontent.com/JhumurHut/global/refs/heads/main/Logo.png" class="h-full w-auto object-contain"></div>
                <span style="font-family:'Great Vibes',cursive;" class="text-3xl text-pinkshade-300">Jhumur Hut</span>
            </a>
            <a href="index.html" class="bg-white/20 px-4 py-2 rounded-full text-xs font-bold"><i class="fa-solid fa-house"></i> Shop</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full px-4 py-8 flex-1">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="bg-white p-6 rounded-3xl border border-pinkshade-200 shadow-sm space-y-4 text-center">
                <div class="w-20 h-20 mx-auto rounded-full bg-pinkshade-100 p-1 border overflow-hidden"><img src="https://raw.githubusercontent.com/JhumurHut/global/refs/heads/main/symbol.png" class="w-full h-full object-cover rounded-full"></div>
                <h2 id="uName" class="font-serif font-bold text-lg">User</h2>
                <nav class="space-y-1 text-xs font-semibold text-left">
                    <button onclick="tab('profile')" id="btn-profile" class="w-full p-3 rounded-xl bg-pinkshade-800 text-white"><i class="fa-regular fa-user mr-2"></i> Profile</button>
                    <button onclick="tab('orders')" id="btn-orders" class="w-full p-3 rounded-xl hover:bg-pinkshade-50"><i class="fa-solid fa-rotate-left mr-2"></i> Orders</button>
                    <button onclick="localStorage.removeItem('jhumur_logged_user');window.location.href='login.html'" class="w-full p-3 rounded-xl text-rose-600 font-bold hover:bg-rose-50"><i class="fa-solid fa-right-from-bracket mr-2"></i> Sign Out</button>
                </nav>
            </div>
            <div class="md:col-span-3 bg-white p-8 rounded-3xl border border-pinkshade-200 shadow-sm">
                <div id="cont-profile" class="space-y-4 text-xs">
                    <h3 class="font-serif text-xl font-bold text-pinkshade-950">Profile Details</h3>
                    <input type="text" id="accName" class="w-full p-3 border rounded-xl bg-pinkshade-50">
                    <input type="email" id="accEmail" readonly class="w-full p-3 border rounded-xl bg-slate-100 text-slate-500">
                    <button onclick="alert('Updated!')" class="bg-pinkshade-800 text-white font-bold px-6 py-3 rounded-xl">Save</button>
                </div>
                <div id="cont-orders" class="space-y-4 text-xs hidden">
                    <h3 class="font-serif text-xl font-bold text-pinkshade-950">My Orders</h3>
                    <div id="orderBox" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-pinkshade-950 text-white py-6 text-center text-xs">© 2026 Jhumur Hut</footer>

    <script>
        const u = JSON.parse(localStorage.getItem('jhumur_logged_user') || 'null');
        if(!u) window.location.href='login.html';
        document.getElementById('uName').innerText = u.name;
        document.getElementById('accName').value = u.name;
        document.getElementById('accEmail').value = u.email;

        function tab(t) {
            document.getElementById('cont-profile').classList.toggle('hidden', t !== 'profile');
            document.getElementById('cont-orders').classList.toggle('hidden', t !== 'orders');
            document.getElementById('btn-profile').className = t==='profile' ? "w-full p-3 rounded-xl bg-pinkshade-800 text-white" : "w-full p-3 rounded-xl hover:bg-pinkshade-50";
            document.getElementById('btn-orders').className = t==='orders' ? "w-full p-3 rounded-xl bg-pinkshade-800 text-white" : "w-full p-3 rounded-xl hover:bg-pinkshade-50";
            if(t==='orders') renderOrders();
        }

        function renderOrders() {
            const orders = JSON.parse(localStorage.getItem('jhumur_orders') || '[]').filter(o => o.customerEmail === u.email);
            document.getElementById('orderBox').innerHTML = orders.length ? orders.map(o => `
                <div class="border border-pinkshade-200 p-4 rounded-xl bg-pinkshade-50/50 space-y-2">
                    <div class="flex justify-between font-bold"><span>${o.orderId}</span><span class="text-pinkshade-700">৳ ${o.grandTotal}</span></div>
                    <p><b>Items:</b> ${o.itemsTextSummary}</p>
                    <p class="text-slate-500 text-[10px]">${o.dateTime}</p>
                </div>
            `).join('') : '<p>No orders yet.</p>';
        }
    </script>
</body>
</html>
