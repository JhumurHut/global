<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category | Jhumur Hut</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/JhumurHut/global/refs/heads/main/Logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { pinkshade: { 50: '#FFF5F8', 100: '#FFE8EF', 300: '#FAA0B5', 700: '#B81155', 800: '#8E0D41', 950: '#42031B' } } } } }
    </script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #FFFFFF 0%, #FFF0F5 50%, #FFE4E1 100%); min-height: 100vh; }</style>
</head>
<body class="flex flex-col justify-between min-h-screen">
    <header class="bg-gradient-to-r from-pinkshade-950 to-pinkshade-800 text-white py-4 px-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <div class="h-12 w-auto"><img src="https://raw.githubusercontent.com/JhumurHut/global/refs/heads/main/Logo.png" class="h-full w-auto object-contain"></div>
                <span style="font-family:'Great Vibes',cursive;" class="text-3xl text-pinkshade-300">Jhumur Hut</span>
            </a>
            <a href="index.html" class="bg-white/20 px-4 py-2 rounded-full text-xs font-bold">Back to Home</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full px-4 py-10 flex-1 space-y-6">
        <h1 id="catTitle" class="font-serif text-3xl font-bold text-pinkshade-950">Category Items</h1>
        <div id="catProductsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6"></div>
    </main>

    <footer class="bg-pinkshade-950 text-white py-6 text-center text-xs">© 2026 Jhumur Hut</footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const cat = params.get('cat') || 'Skincare';
        document.getElementById('catTitle').innerText = `${cat} Collection ✨`;

        const saved = JSON.parse(localStorage.getItem('jhumur_products') || '[]');
        const list = saved.filter(p => p.category === cat);

        document.getElementById('catProductsGrid').innerHTML = list.length ? list.map(p => `
            <div class="bg-white rounded-2xl overflow-hidden border border-pinkshade-200 shadow-sm flex flex-col justify-between">
                <div class="aspect-square bg-pinkshade-50"><img src="${p.image}" class="w-full h-full object-cover"></div>
                <div class="p-4 space-y-2">
                    <h4 class="font-serif font-semibold text-sm">${p.name}</h4>
                    <div class="flex justify-between items-center"><span class="text-pinkshade-800 font-bold">৳ ${p.price}</span><a href="product.html?id=${p.id}" class="bg-pinkshade-800 text-white text-xs px-3 py-1.5 rounded-full font-bold">View</a></div>
                </div>
            </div>
        `).join('') : '<p>No items found in this category.</p>';
    </script>
</body>
</html>
