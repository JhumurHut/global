<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your account - Jhumur Hut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pinkshade: {
                            50: '#FFF0F5', 100: '#FFE4E1', 200: '#FBCFE8', 300: '#F472B6',
                            500: '#EC4899', 600: '#DB2777', 700: '#BE185D', 800: '#9D174D', 900: '#831843', 950: '#500724'
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        cursive: ['Great Vibes', 'cursive']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-[#FFF0F5] via-[#F8E7F6] to-[#FAF0F8] text-slate-900 min-h-screen flex flex-col justify-between p-6 font-sans">

    <!-- TOP BAR WITH JHUMUR HUT LOGO -->
    <div class="flex justify-between items-center max-w-xl mx-auto w-full pt-4">
        <a href="index.html" class="flex items-center gap-3 group">
            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-pinkshade-300 via-pinkshade-500 to-white p-0.5 shadow-md overflow-hidden flex-shrink-0">
                <div class="w-full h-full bg-white rounded-full flex items-center justify-center overflow-hidden">
                    <img src="https://raw.githubusercontent.com/JhumurHut/global/refs/heads/main/Logo.png" alt="Jhumur Hut Logo" class="w-full h-full object-cover">
                </div>
            </div>
            <span class="font-cursive text-3xl font-normal text-pinkshade-900">Jhumur Hut</span>
        </a>
        <a href="index.html" class="w-9 h-9 rounded-full bg-white/80 border border-pinkshade-200 flex items-center justify-center text-slate-600 hover:text-pinkshade-900 transition shadow-sm"><i class="fa-solid fa-xmark text-base"></i></a>
    </div>

    <!-- MAIN FORM CONTAINER -->
    <div class="max-w-md w-full mx-auto my-auto py-8 bg-white/80 backdrop-blur-md p-8 rounded-3xl shadow-xl border border-pinkshade-200 space-y-6">
        <div class="text-center space-y-1">
            <h1 class="font-serif text-2xl font-bold text-pinkshade-950">Sign in to your account</h1>
            <p class="text-xs text-slate-500">New user? <button onclick="openSignUpModal()" class="text-pinkshade-700 font-bold hover:underline">Create an account</button></p>
        </div>

        <form onsubmit="handleEmailLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block font-bold text-slate-700 mb-1">Phone number or email</label>
                <input type="text" id="loginEmail" required class="w-full p-3 border rounded-xl bg-pinkshade-50/50 outline-none focus:ring-2 focus:ring-pinkshade-500" placeholder="8801758964710">
            </div>
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="font-bold text-slate-700">Password</label>
                    <button type="button" onclick="alert('Password reset link sent to your registered contact!')" class="text-pinkshade-700 font-bold hover:underline">Forgot password?</button>
                </div>
                <input type="password" id="loginPassword" required class="w-full p-3 border rounded-xl bg-pinkshade-50/50 outline-none focus:ring-2 focus:ring-pinkshade-500" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-pinkshade-700 to-pinkshade-900 text-white font-bold py-3.5 rounded-xl shadow-lg hover:from-pinkshade-800 transition text-sm">
                Sign in
            </button>
        </form>

        <div class="flex items-center my-4">
            <div class="flex-grow border-t border-pinkshade-200"></div>
            <span class="px-3 text-slate-400 text-[10px] uppercase font-bold">OR</span>
            <div class="flex-grow border-t border-pinkshade-200"></div>
        </div>

        <!-- SOCIAL BUTTONS -->
        <div class="space-y-2.5 text-xs">
            <button onclick="socialLogin('Google')" class="w-full border border-pinkshade-200 bg-white rounded-xl p-3 font-semibold flex items-center justify-center gap-2 hover:bg-pinkshade-50 shadow-sm transition">
                <i class="fa-brands fa-google text-red-500"></i> Sign with Google
            </button>
            <button onclick="socialLogin('Apple')" class="w-full border border-pinkshade-200 bg-white rounded-xl p-3 font-semibold flex items-center justify-center gap-2 hover:bg-pinkshade-50 shadow-sm transition">
                <i class="fa-brands fa-apple"></i> Sign with Apple
            </button>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="text-center text-[10px] text-slate-500 max-w-md mx-auto pb-4">
        This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.
    </div>

    <!-- SIGN UP MODAL -->
    <div id="signUpModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-md hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border border-pinkshade-200 space-y-4 text-xs relative">
            <button onclick="closeSignUpModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-pinkshade-100 text-pinkshade-900 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            <div class="text-center">
                <h3 class="font-serif text-2xl font-bold text-pinkshade-950">Create an Account</h3>
                <p class="text-slate-500 mt-1">Join Jhumur Hut for a fairy shopping experience</p>
            </div>
            <form onsubmit="handleSignUp(event)" class="space-y-3">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Full Name *</label>
                    <input type="text" id="regName" required class="w-full p-3 border rounded-xl bg-pinkshade-50/50" placeholder="Your Name">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Email Address *</label>
                    <input type="email" id="regEmail" required class="w-full p-3 border rounded-xl bg-pinkshade-50/50" placeholder="yourmail@gmail.com">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Phone Number *</label>
                    <input type="tel" id="regPhone" required class="w-full p-3 border rounded-xl bg-pinkshade-50/50" placeholder="017XXXXXXXX">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Delivery Address *</label>
                    <textarea id="regAddress" required class="w-full p-2.5 border rounded-xl bg-pinkshade-50/50 h-16" placeholder="House, Road, City..."></textarea>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Create Password *</label>
                    <input type="password" id="regPassword" required class="w-full p-3 border rounded-xl bg-pinkshade-50/50" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-pinkshade-700 to-pinkshade-900 text-white font-bold py-3.5 rounded-xl shadow-lg hover:from-pinkshade-800 transition">
                    Create Account
                </button>
            </form>
        </div>
    </div>

    <script>
        function handleEmailLogin(e) {
            e.preventDefault();
            const input = document.getElementById('loginEmail').value.toLowerCase().trim();
            const pass = document.getElementById('loginPassword').value;

            const db = JSON.parse(localStorage.getItem('jhumur_users_db') || '[]');
            const user = db.find(u => u.email === input || u.phone === input);

            if(user) {
                if(user.password === pass) {
                    localStorage.setItem('jhumur_logged_user', JSON.stringify(user));
                    window.location.href = "account.html";
                } else { alert('❌ Incorrect Password!'); }
            } else {
                const newUser = { name: input.split('@')[0], email: input, phone: input, password: pass, address: 'Dhaka, Bangladesh', photo: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80' };
                db.push(newUser);
                localStorage.setItem('jhumur_users_db', JSON.stringify(db));
                localStorage.setItem('jhumur_logged_user', JSON.stringify(newUser));
                window.location.href = "account.html";
            }
        }

        function openSignUpModal() { document.getElementById('signUpModal').classList.remove('hidden'); }
        function closeSignUpModal() { document.getElementById('signUpModal').classList.add('hidden'); }

        function handleSignUp(e) {
            e.preventDefault();
            const newUser = {
                name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                phone: document.getElementById('regPhone').value,
                address: document.getElementById('regAddress').value,
                password: document.getElementById('regPassword').value,
                photo: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80'
            };
            let db = JSON.parse(localStorage.getItem('jhumur_users_db') || '[]');
            db.push(newUser);
            localStorage.setItem('jhumur_users_db', JSON.stringify(db));
            localStorage.setItem('jhumur_logged_user', JSON.stringify(newUser));
            window.location.href = "account.html";
        }

        function socialLogin(provider) {
            const newUser = { name: `User (${provider})`, email: `user.${provider.toLowerCase()}@gmail.com`, phone: '01700000000', address: 'Dhaka, Bangladesh', photo: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80' };
            localStorage.setItem('jhumur_logged_user', JSON.stringify(newUser));
            window.location.href = "account.html";
        }
    </script>
</body>
</html>
