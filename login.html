<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your account - Jhumur Hut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-white text-slate-900 min-h-screen flex flex-col justify-between p-6 font-sans">

    <!-- TOP BAR -->
    <div class="flex justify-between items-center max-w-xl mx-auto w-full">
        <a href="index.html" class="font-bold text-2xl font-serif">Jhumur Hut</a>
        <a href="index.html" class="text-slate-400 hover:text-black"><i class="fa-solid fa-xmark text-xl"></i></a>
    </div>

    <!-- MAIN FORM CONTAINER (TEMPLATE 1 MATCHED) -->
    <div class="max-w-md w-full mx-auto my-auto py-8 space-y-6">
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-bold">Sign in to your account</h1>
            <p class="text-xs text-slate-500">New user? <button onclick="openSignUpModal()" class="text-blue-600 font-semibold hover:underline">Create an account</button></p>
        </div>

        <form onsubmit="handleEmailLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-500 mb-1">Phone number or email</label>
                <input type="text" id="loginEmail" required class="w-full p-3 border rounded-xl outline-none focus:border-black" placeholder="8801758964710">
            </div>
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-slate-500">Password</label>
                    <button type="button" onclick="alert('Password reset link sent to your registered contact!')" class="text-slate-500 hover:underline">Forgot password?</button>
                </div>
                <input type="password" id="loginPassword" required class="w-full p-3 border rounded-xl outline-none focus:border-black" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-black text-white font-bold py-3.5 rounded-xl hover:bg-slate-800 transition text-sm">
                Sign in
            </button>
        </form>

        <div class="flex items-center my-4">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="px-3 text-slate-400 text-[10px] uppercase">OR</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <!-- SOCIAL BUTTONS -->
        <div class="space-y-2 text-xs">
            <button onclick="socialLogin('Google')" class="w-full border rounded-xl p-3 font-semibold flex items-center justify-center gap-2 hover:bg-slate-50">
                <i class="fa-brands fa-google text-red-500"></i> Sign with Google
            </button>
            <button onclick="socialLogin('Apple')" class="w-full border rounded-xl p-3 font-semibold flex items-center justify-center gap-2 hover:bg-slate-50">
                <i class="fa-brands fa-apple"></i> Sign with Apple
            </button>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="text-center text-[10px] text-slate-400 max-w-md mx-auto">
        This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.
    </div>

    <!-- SIGN UP MODAL -->
    <div id="signUpModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 text-xs relative">
            <button onclick="closeSignUpModal()" class="absolute top-4 right-4 text-slate-400 hover:text-black"><i class="fa-solid fa-xmark text-base"></i></button>
            <h3 class="font-bold text-base text-slate-900 border-b pb-2">Create an Account</h3>
            <form onsubmit="handleSignUp(event)" class="space-y-3">
                <input type="text" id="regName" required placeholder="Full Name" class="w-full p-3 border rounded-xl">
                <input type="email" id="regEmail" required placeholder="Email Address" class="w-full p-3 border rounded-xl">
                <input type="tel" id="regPhone" required placeholder="Phone Number" class="w-full p-3 border rounded-xl">
                <textarea id="regAddress" required placeholder="Delivery Address" class="w-full p-3 border rounded-xl h-16"></textarea>
                <input type="password" id="regPassword" required placeholder="Create Password" class="w-full p-3 border rounded-xl">
                <button type="submit" class="w-full bg-black text-white font-bold py-3 rounded-xl hover:bg-slate-800 transition">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        function handleEmailLogin(e) {
            e.preventDefault();
            const input = document.getElementById('loginEmail').value.toLowerCase().trim();
            const pass = document.getElementById('loginPassword').value;

            const db = JSON.parse(localStorage.getItem('jhumur_users_db') || '[]');
            const user = db.find(u => u.email === input || u.phone === input);

            if(user) {
                if(user.password === pass) {
                    localStorage.setItem('jhumur_logged_user', JSON.stringify(user));
                    window.location.href = "account.html";
                } else { alert('Incorrect Password!'); }
            } else {
                const newUser = { name: input.split('@')[0], email: input, phone: input, password: pass, address: 'Dhaka, Bangladesh' };
                localStorage.setItem('jhumur_logged_user', JSON.stringify(newUser));
                window.location.href = "account.html";
            }
        }

        function openSignUpModal() { document.getElementById('signUpModal').classList.remove('hidden'); }
        function closeSignUpModal() { document.getElementById('signUpModal').classList.add('hidden'); }

        function handleSignUp(e) {
            e.preventDefault();
            const newUser = {
                name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                phone: document.getElementById('regPhone').value,
                address: document.getElementById('regAddress').value,
                password: document.getElementById('regPassword').value
            };
            let db = JSON.parse(localStorage.getItem('jhumur_users_db') || '[]');
            db.push(newUser);
            localStorage.setItem('jhumur_users_db', JSON.stringify(db));
            localStorage.setItem('jhumur_logged_user', JSON.stringify(newUser));
            window.location.href = "account.html";
        }

        function socialLogin(provider) {
            const newUser = { name: `User (${provider})`, email: `user.${provider.toLowerCase()}@gmail.com`, phone: '01700000000', address: 'Dhaka, Bangladesh' };
            localStorage.setItem('jhumur_logged_user', JSON.stringify(newUser));
            window.location.href = "account.html";
        }
    </script>
</body>
</html>
