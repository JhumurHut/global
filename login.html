<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Jhumur Hut</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/JhumurHut/global/refs/heads/main/Logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { pinkshade: { 50: '#FFF5F8', 100: '#FFE8EF', 300: '#FAA0B5', 700: '#B81155', 800: '#8E0D41', 950: '#42031B' } } } }
        }
    </script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #FFFFFF 0%, #FFF0F5 50%, #FFE4E1 100%); min-height: 100vh; }</style>
</head>
<body class="flex flex-col justify-between min-h-screen">
    <header class="py-6 px-6 max-w-7xl mx-auto w-full flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-3">
            <div class="h-12 w-auto"><img src="https://raw.githubusercontent.com/JhumurHut/global/refs/heads/main/Logo.png" class="h-full w-auto object-contain"></div>
            <span style="font-family:'Great Vibes',cursive;" class="text-3xl text-pinkshade-800">Jhumur Hut</span>
        </a>
        <a href="index.html" class="w-9 h-9 rounded-full bg-white flex items-center justify-center shadow border text-slate-600"><i class="fa-solid fa-xmark"></i></a>
    </header>

    <main class="max-w-md w-full mx-auto px-4 py-6">
        <div class="bg-white/90 backdrop-blur-md rounded-3xl p-8 border border-pinkshade-200 shadow-xl space-y-6">
            <div class="text-center space-y-1">
                <h1 class="font-serif text-2xl font-bold text-pinkshade-950">Sign in to your account</h1>
                <p class="text-xs text-slate-500">New user? <a href="#" onclick="toggleMode('signup');return false;" class="text-pinkshade-700 font-bold underline">Create account</a></p>
            </div>
            <form onsubmit="handleAuth(event)" class="space-y-4 text-xs">
                <div id="nameBox" class="hidden">
                    <label class="block font-bold mb-1">Full Name *</label>
                    <input type="text" id="inName" class="w-full p-3.5 border rounded-2xl bg-pinkshade-50">
                </div>
                <div>
                    <label class="block font-bold mb-1">Email or Phone</label>
                    <input type="text" id="inId" required class="w-full p-3.5 border rounded-2xl bg-pinkshade-50">
                </div>
                <div>
                    <label class="block font-bold mb-1">Password</label>
                    <input type="password" id="inPass" required class="w-full p-3.5 border rounded-2xl bg-pinkshade-50">
                </div>
                <button type="submit" id="subBtn" class="w-full bg-pinkshade-800 text-white font-bold py-3.5 rounded-2xl shadow">Sign In</button>
            </form>
        </div>
    </main>

    <footer class="py-6 text-center text-xs text-slate-500">© 2026 Jhumur Hut</footer>

    <script>
        let isUp = false;
        function toggleMode(m) {
            isUp = m === 'signup';
            document.getElementById('nameBox').classList.toggle('hidden', !isUp);
            document.getElementById('subBtn').innerText = isUp ? 'Create Account' : 'Sign In';
        }
        function handleAuth(e) {
            e.preventDefault();
            const id = document.getElementById('inId').value.trim().toLowerCase(), pass = document.getElementById('inPass').value, name = document.getElementById('inName').value;
            let db = JSON.parse(localStorage.getItem('jhumur_users_db') || '[]');
            if (isUp) {
                if(db.some(u => u.email === id)) return alert('User already exists!');
                const u = { name: name || 'User', email: id, phone: '', address: '', password: pass };
                db.push(u); localStorage.setItem('jhumur_users_db', JSON.stringify(db));
                localStorage.setItem('jhumur_logged_user', JSON.stringify(u));
                window.location.href = 'account.html';
            } else {
                const u = db.find(x => x.email === id && x.password === pass);
                if (u) { localStorage.setItem('jhumur_logged_user', JSON.stringify(u)); window.location.href = 'account.html'; }
                else alert('Invalid Credentials!');
            }
        }
    </script>
</body>
</html>
